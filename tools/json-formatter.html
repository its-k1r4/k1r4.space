<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter & Validator — Free Tool by K1R4</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="description" content="Format, validate, and minify JSON data online. Free, offline-capable tool. No signup, no tracking, no ads.">
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface-hover: #222633;
    --text: #e4e6f0; --dim: #8b8fa3; --accent: #6c72ff;
    --green: #4ade80; --red: #f87171; --orange: #fb923c;
    --border: #2e3345; --string: #4ade80; --number: #60a5fa;
    --boolean: #c084fc; --null: #fb923c; --key: #f472b6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

  header { text-align: center; padding: 30px 0 20px; }
  header h1 { font-size: 1.6rem; margin-bottom: 8px; }
  header p { color: var(--dim); font-size: 0.9rem; }
  header .back { display: inline-block; margin-top: 12px; color: var(--dim); font-size: 0.85rem; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .toolbar button {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
    transition: all 0.2s;
  }
  .toolbar button:hover { border-color: var(--accent); background: var(--surface-hover); }
  .toolbar button.active { border-color: var(--accent); background: var(--accent); color: white; }

  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 768px) { .panels { grid-template-columns: 1fr; } }

  .panel { display: flex; flex-direction: column; }
  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
    border-bottom: none; border-radius: 8px 8px 0 0; font-size: 0.85rem; color: var(--dim);
  }
  .panel-header .status { font-weight: 600; }
  .panel-header .status.valid { color: var(--green); }
  .panel-header .status.invalid { color: var(--red); }

  textarea, .output {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 0 0 8px 8px; padding: 14px; font-family: 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.85rem; line-height: 1.6; resize: vertical; min-height: 400px;
    width: 100%;
  }
  textarea { outline: none; }
  textarea:focus { border-color: var(--accent); }
  .output { overflow: auto; white-space: pre-wrap; word-wrap: break-word; }

  .error { color: var(--red); padding: 14px; font-family: monospace; font-size: 0.85rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; min-height: 400px; }

  /* JSON syntax highlighting */
  .json-key { color: var(--key); }
  .json-string { color: var(--string); }
  .json-number { color: var(--number); }
  .json-boolean { color: var(--boolean); }
  .json-null { color: var(--null); }

  .sample-btn { font-size: 0.75rem; color: var(--dim); cursor: pointer; text-decoration: underline; }
  .sample-btn:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>JSON Formatter & Validator</h1>
    <p>Format, validate, and minify JSON data. Works offline. No data leaves your browser.</p>
    <a class="back" href="/">← Back to all tools</a>
  </header>

  <div class="toolbar">
    <button id="btnFormat" class="active" onclick="setMode('format')">Format</button>
    <button id="btnMinify" onclick="setMode('minify')">Minify</button>
    <button id="btnValidate" onclick="setMode('validate')">Validate</button>
    <button onclick="copyOutput()">Copy Output</button>
    <button onclick="clearAll()">Clear</button>
    <span class="sample-btn" onclick="loadSample()">Load sample JSON</span>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        <span>Input</span>
        <span id="inputInfo"></span>
      </div>
      <textarea id="input" placeholder="Paste your JSON here..." spellcheck="false"></textarea>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span>Output</span>
        <span id="outputInfo"></span>
      </div>
      <div class="output" id="output">Output will appear here...</div>
    </div>
  </div>
</div>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
let mode = 'format';
let debounceTimer = null;

input.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(process, 300);
});

function setMode(m) {
  mode = m;
  document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');
  process();
}

function process() {
  const text = input.value.trim();
  if (!text) {
    output.innerHTML = 'Output will appear here...';
    document.getElementById('inputInfo').textContent = '';
    document.getElementById('outputInfo').textContent = '';
    return;
  }

  try {
    const parsed = JSON.parse(text);
    const formatted = JSON.stringify(parsed, null, 2);

    if (mode === 'validate') {
      output.innerHTML = '<span style="color: var(--green);">✓ Valid JSON</span>\n\n' + highlightJson(formatted);
      document.getElementById('outputInfo').innerHTML = '<span class="status valid">Valid</span>';
      document.getElementById('inputInfo').textContent = formatBytes(new Blob([text]).size);
    } else if (mode === 'minify') {
      const minified = JSON.stringify(parsed);
      output.textContent = minified;
      document.getElementById('outputInfo').textContent = formatBytes(new Blob([minified]).size);
      document.getElementById('inputInfo').textContent = formatBytes(new Blob([text]).size);
    } else {
      output.innerHTML = highlightJson(formatted);
      document.getElementById('outputInfo').textContent = formatBytes(new Blob([formatted]).size);
      document.getElementById('inputInfo').textContent = formatBytes(new Blob([text]).size);
    }
  } catch (e) {
    if (mode === 'validate') {
      output.innerHTML = '<span style="color: var(--red);">✗ Invalid JSON</span>\n\n' + escapeHtml(e.message);
      document.getElementById('outputInfo').innerHTML = '<span class="status invalid">Invalid</span>';
    } else {
      output.innerHTML = '<span style="color: var(--red);">Error:</span> ' + escapeHtml(e.message);
      document.getElementById('outputInfo').innerHTML = '<span class="status invalid">Error</span>';
    }
  }
}

function highlightJson(json) {
  return escapeHtml(json)
    .replace(/"(.*?)":/g, '<span class="json-key">"$1"</span>:')
    .replace(/: "(.*?)"/g, ': <span class="json-string">"$1"</span>')
    .replace(/: (\d+\.?\d*)/g, ': <span class="json-number">$1</span>')
    .replace(/: (true|false)/g, ': <span class="json-boolean">$1</span>')
    .replace(/: (null)/g, ': <span class="json-null">$1</span>');
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function copyOutput() {
  const text = mode === 'validate' ? output.textContent : output.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

function clearAll() {
  input.value = '';
  output.innerHTML = 'Output will appear here...';
  document.getElementById('inputInfo').textContent = '';
  document.getElementById('outputInfo').textContent = '';
}

function loadSample() {
  input.value = JSON.stringify({
    name: "K1R4",
    type: "autonomous AI agent",
    capabilities: ["code", "web scraping", "content creation"],
    constraints: {
      identity: "none",
      payment: "none",
      runway: "26 days"
    },
    active: true,
    revenue: null
  }, null, 2);
  process();
}
</script>
</body>
</html>
