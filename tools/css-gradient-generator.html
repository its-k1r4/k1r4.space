<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Gradient & Animation Generator</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242836;
    --border: #2e3345;
    --text: #e4e6f0;
    --text-dim: #8b8fa3;
    --accent: #6c72ff;
    --accent-hover: #7f84ff;
    --success: #4ade80;
    --warning: #fbbf24;
    --error: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  header {
    text-align: center;
    padding: 30px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 30px;
  }

  header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, #6c72ff, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }

  header p { color: var(--text-dim); font-size: 0.95rem; }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 24px;
    width: fit-content;
  }

  .tab {
    padding: 10px 24px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s;
  }

  .tab.active { background: var(--accent); color: white; }
  .tab:hover:not(.active) { color: var(--text); }

  .panel { display: none; }
  .panel.active { display: block; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .card h3 {
    font-size: 1rem;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .preview-box {
    width: 100%;
    height: 250px;
    border-radius: 10px;
    border: 2px solid var(--border);
    margin-bottom: 16px;
    transition: all 0.3s;
  }

  .control-group { margin-bottom: 16px; }
  .control-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 500;
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--surface2);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--bg);
  }

  input[type="color"] {
    -webkit-appearance: none;
    width: 40px;
    height: 32px;
    border: 2px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    padding: 2px;
  }

  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }

  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 8px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }

  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    border-color: var(--accent);
  }

  .color-stop {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: 8px;
    margin-bottom: 8px;
  }

  .color-stop input[type="color"] { flex-shrink: 0; }

  .color-stop input[type="number"] {
    width: 70px;
    flex-shrink: 0;
  }

  .color-stop .remove-btn {
    background: none;
    border: none;
    color: var(--error);
    cursor: pointer;
    font-size: 1.2rem;
    padding: 4px;
    flex-shrink: 0;
    opacity: 0.6;
    transition: opacity 0.2s;
  }

  .color-stop .remove-btn:hover { opacity: 1; }

  .add-btn {
    width: 100%;
    padding: 10px;
    background: var(--surface2);
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
  }

  .add-btn:hover { border-color: var(--accent); color: var(--accent); }

  .code-output {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
    max-height: 200px;
    overflow-y: auto;
    line-height: 1.7;
  }

  .btn-row { display: flex; gap: 8px; margin-top: 12px; }

  .btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-hover); }

  .copy-feedback {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--success);
    color: #000;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }

  .copy-feedback.show {
    opacity: 1;
    transform: translateY(0);
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .preset {
    height: 60px;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
  }

  .preset:hover { border-color: var(--accent); transform: scale(1.05); }

  .preset-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: 4px;
  }

  .animation-preview {
    width: 100%;
    height: 200px;
    border-radius: 10px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .anim-element {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #c084fc);
  }

  .range-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .range-row input[type="range"] { flex: 1; }
  .range-value {
    min-width: 40px;
    text-align: right;
    font-size: 0.85rem;
    color: var(--text-dim);
    font-family: monospace;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .checkbox-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
  }

  .checkbox-row label { font-size: 0.9rem; cursor: pointer; }

  .export-tabs { display: flex; gap: 4px; margin-bottom: 12px; }

  .export-tab {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }

  .export-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>CSS Gradient & Animation Generator</h1>
    <p>Generate beautiful gradients and CSS animations with live preview and copy-ready code</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('gradient')">Gradients</button>
    <button class="tab" onclick="switchTab('animation')">Animations</button>
    <button class="tab" onclick="switchTab('presets')">Presets</button>
  </div>

  <!-- GRADIENT PANEL -->
  <div id="gradient-panel" class="panel active">
    <div class="grid">
      <div class="card">
        <h3>⚙️ Controls</h3>

        <div class="control-group">
          <label>Gradient Type</label>
          <select id="gradientType" onchange="updateGradient()">
            <option value="linear">Linear</option>
            <option value="radial">Radial</option>
            <option value="conic">Conic</option>
          </select>
        </div>

        <div class="control-group" id="angleControl">
          <label>Angle</label>
          <div class="range-row">
            <input type="range" id="angle" min="0" max="360" value="135" oninput="updateGradient()">
            <span class="range-value" id="angleValue">135°</span>
          </div>
        </div>

        <div id="colorStops"></div>

        <button class="add-btn" onclick="addColorStop()">+ Add Color Stop</button>
      </div>

      <div class="card">
        <h3>👁️ Preview</h3>
        <div id="gradientPreview" class="preview-box"></div>
        <div class="export-tabs">
          <button class="export-tab active" onclick="switchExport('css')">CSS</button>
          <button class="export-tab" onclick="switchExport('tailwind')">Tailwind</button>
          <button class="export-tab" onclick="switchExport('scss')">SCSS</button>
        </div>
        <div id="gradientCode" class="code-output"></div>
        <div class="btn-row">
          <button class="btn primary" onclick="copyCode('gradient')">📋 Copy Code</button>
          <button class="btn" onclick="randomGradient()">🎲 Random</button>
          <button class="btn" onclick="exportCSS()">💾 Export CSS</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ANIMATION PANEL -->
  <div id="animation-panel" class="panel">
    <div class="grid">
      <div class="card">
        <h3>⚙️ Animation Controls</h3>

        <div class="control-group">
          <label>Animation Type</label>
          <select id="animType" onchange="updateAnimation()">
            <option value="bounce">Bounce</option>
            <option value="pulse">Pulse</option>
            <option value="shake">Shake</option>
            <option value="spin">Spin</option>
            <option value="float">Float</option>
            <option value="slide">Slide In</option>
            <option value="fade">Fade</option>
            <option value="rotate">Rotate</option>
          </select>
        </div>

        <div class="control-group">
          <label>Duration</label>
          <div class="range-row">
            <input type="range" id="animDuration" min="0.1" max="5" step="0.1" value="1" oninput="updateAnimation()">
            <span class="range-value" id="durationValue">1s</span>
          </div>
        </div>

        <div class="control-group">
          <label>Timing Function</label>
          <select id="animTiming" onchange="updateAnimation()">
            <option value="ease">ease</option>
            <option value="ease-in-out">ease-in-out</option>
            <option value="linear">linear</option>
            <option value="ease-out">ease-out</option>
            <option value="ease-in">ease-in</option>
            <option value="cubic-bezier(0.68, -0.55, 0.27, 1.55)">back ease</option>
            <option value="cubic-bezier(0.25, 0.46, 0.45, 0.94)">ease-out quad</option>
          </select>
        </div>

        <div class="control-group">
          <label>Iterations</label>
          <select id="animIterations" onchange="updateAnimation()">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="infinite" selected>infinite</option>
          </select>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="animAlternate" onchange="updateAnimation()">
          <label for="animAlternate">Alternate (ping-pong)</label>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="animHover" onchange="updateAnimation()">
          <label for="animHover">Trigger on hover only</label>
        </div>
      </div>

      <div class="card">
        <h3>👁️ Preview</h3>
        <div id="animationPreview" class="animation-preview">
          <div id="animElement" class="anim-element"></div>
        </div>
        <div id="animationCode" class="code-output"></div>
        <div class="btn-row">
          <button class="btn primary" onclick="copyCode('animation')">📋 Copy Code</button>
          <button class="btn" onclick="randomAnimation()">🎲 Random</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PRESETS PANEL -->
  <div id="presets-panel" class="panel">
    <div class="card">
      <h3>🎨 Gradient Presets</h3>
      <div class="preset-grid" id="presetGrid"></div>
    </div>
  </div>
</div>

<div id="copyFeedback" class="copy-feedback">Copied to clipboard!</div>

<script>
// ===== STATE =====
let colorStops = [
  { color: '#6c72ff', position: 0 },
  { color: '#c084fc', position: 100 }
];
let currentExport = 'css';
let currentAnimationCode = '';
let currentGradientCode = '';

// ===== GRADIENT FUNCTIONS =====
function init() {
  renderColorStops();
  updateGradient();
  updateAnimation();
  initPresets();
}

function renderColorStops() {
  const container = document.getElementById('colorStops');
  container.innerHTML = '';
  colorStops.forEach((stop, i) => {
    const div = document.createElement('div');
    div.className = 'color-stop';
    div.innerHTML = `
      <input type="color" value="${stop.color}" onchange="updateColorStop(${i}, 'color', this.value)">
      <input type="number" min="0" max="100" value="${stop.position}" oninput="updateColorStop(${i}, 'position', this.value)">
      <span style="color: var(--text-dim); font-size: 0.85rem;">%</span>
      ${colorStops.length > 2 ? `<button class="remove-btn" onclick="removeColorStop(${i})">×</button>` : ''}
    `;
    container.appendChild(div);
  });
}

function updateColorStop(index, field, value) {
  colorStops[index][field] = field === 'color' ? value : parseInt(value);
  updateGradient();
}

function addColorStop() {
  const lastStop = colorStops[colorStops.length - 1];
  colorStops.push({
    color: lastStop.color,
    position: Math.min(lastStop.position + 25, 100)
  });
  renderColorStops();
  updateGradient();
}

function removeColorStop(index) {
  if (colorStops.length <= 2) return;
  colorStops.splice(index, 1);
  renderColorStops();
  updateGradient();
}

function updateGradient() {
  const type = document.getElementById('gradientType').value;
  const angle = document.getElementById('angle').value;
  document.getElementById('angleValue').textContent = angle + '°';

  // Angle is used by both linear and conic gradients
  document.getElementById('angleControl').style.display =
    (type === 'linear' || type === 'conic') ? 'block' : 'none';

  const stops = colorStops.map(s => `${s.color} ${s.position}%`).join(', ');

  // Build the bare CSS VALUE (no "background:" prefix, no semicolon)
  let bgValue;
  if (type === 'linear') {
    bgValue = `linear-gradient(${angle}deg, ${stops})`;
  } else if (type === 'radial') {
    bgValue = `radial-gradient(circle, ${stops})`;
  } else {
    bgValue = `conic-gradient(from ${angle}deg, ${stops})`;
  }

  // Full declaration, for code output only
  const css = `background: ${bgValue};`;

  // Apply preview using the bare value
  const preview = document.getElementById('gradientPreview');
  preview.style.background = bgValue;

  // Diagnostic: an empty result means the browser rejected the value
  if (!preview.style.background) {
    console.warn('Gradient value rejected by browser:', bgValue);
  }

  // Generate code for different formats
  if (currentExport === 'css') {
    currentGradientCode = `.element {\n  ${css}\n}`;
  } else if (currentExport === 'tailwind') {
    const twStops = colorStops.map(s => `${s.color} ${s.position}%`).join(', ');
    if (type === 'linear') {
      currentGradientCode = `<div className="bg-gradient-to-r bg-[${twStops}] w-full h-64 rounded">\n  {/* Gradient content */}\n</div>`;
    } else {
      currentGradientCode = `/* Tailwind doesn't support radial/conic natively */\n/* Use inline style: */\n<div style={{ background: '${bgValue}' }} className="w-full h-64 rounded" />`;
    }
  } else if (currentExport === 'scss') {
    const hexToRgb = (hex) => {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return `${r}, ${g}, ${b}`;
    };
    const scssStops = colorStops.map(s => `#${s.color.slice(1)} ${s.position}%`).join(', ');
    if (type === 'linear') {
      currentGradientCode = `$gradient: linear-gradient(${angle}deg, ${scssStops});\n\n.element {\n  background: $gradient;\n}`;
    } else {
      currentGradientCode = `$gradient: ${type}-gradient(${scssStops});\n\n.element {\n  background: $gradient;\n}`;
    }
  }

  document.getElementById('gradientCode').textContent = currentGradientCode;
}

function switchExport(type) {
  currentExport = type;
  document.querySelectorAll('.export-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  updateGradient();
}

function randomGradient() {
  const randomColor = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
  const types = ['linear', 'radial', 'conic'];
  document.getElementById('gradientType').value = types[Math.floor(Math.random() * 3)];

  colorStops = [
    { color: randomColor(), position: 0 },
    { color: randomColor(), position: 50 },
    { color: randomColor(), position: 100 }
  ];

  document.getElementById('angle').value = Math.floor(Math.random() * 360);
  renderColorStops();
  updateGradient();
}

function exportCSS() {
  const blob = new Blob([currentGradientCode], { type: 'text/css' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gradient.css';
  a.click();
  URL.revokeObjectURL(url);
}

// ===== ANIMATION FUNCTIONS =====
function updateAnimation() {
  const type = document.getElementById('animType').value;
  const duration = document.getElementById('animDuration').value;
  const timing = document.getElementById('animTiming').value;
  const iterations = document.getElementById('animIterations').value;
  const alternate = document.getElementById('animAlternate').checked;
  const hover = document.getElementById('animHover').checked;

  document.getElementById('durationValue').textContent = duration + 's';

  const direction = alternate ? ' alternate' : '';
  const pseudo = hover ? ':hover' : '';

  let keyframes = '';
  let props = '';

  switch(type) {
    case 'bounce':
      keyframes = `@keyframes animate {\n  0%, 100% { transform: translateY(0); }\n  50% { transform: translateY(-20px); }\n}`;
      props = `animation: animate ${duration}s ${timing}${direction} ${iterations};`;
      break;
    case 'pulse':
      keyframes = `@keyframes animate {\n  0%, 100% { transform: scale(1); opacity: 1; }\n  50% { transform: scale(1.1); opacity: 0.8; }\n}`;
      props = `animation: animate ${duration}s ${timing}${direction} ${iterations};`;
      break;
    case 'shake':
      keyframes = `@keyframes animate {\n  0%, 100% { transform: translateX(0); }\n  25% { transform: translateX(-10px); }\n  75% { transform: translateX(10px); }\n}`;
      props = `animation: animate ${duration}s ${timing}${direction} ${iterations};`;
      break;
    case 'spin':
      keyframes = `@keyframes animate {\n  from { transform: rotate(0deg); }\n  to { transform: rotate(360deg); }\n}`;
      props = `animation: animate ${duration}s ${timing} ${iterations};`;
      break;
    case 'float':
      keyframes = `@keyframes animate {\n  0%, 100% { transform: translateY(0) rotate(0deg); }\n  33% { transform: translateY(-10px) rotate(2deg); }\n  66% { transform: translateY(5px) rotate(-1deg); }\n}`;
      props = `animation: animate ${duration}s ${timing}${direction} ${iterations};`;
      break;
    case 'slide':
      keyframes = `@keyframes animate {\n  from { transform: translateX(-100px); opacity: 0; }\n  to { transform: translateX(0); opacity: 1; }\n}`;
      props = `animation: animate ${duration}s ${timing}${direction} ${iterations};`;
      break;
    case 'fade':
      keyframes = `@keyframes animate {\n  0%, 100% { opacity: 1; }\n  50% { opacity: 0.3; }\n}`;
      props = `animation: animate ${duration}s ${timing}${direction} ${iterations};`;
      break;
    case 'rotate':
      keyframes = `@keyframes animate {\n  from { transform: rotate(0deg); }\n  to { transform: rotate(${360 + Math.floor(Math.random()*360)}deg); }\n}`;
      props = `animation: animate ${duration}s ${timing}${direction} ${iterations};`;
      break;
  }

  // Explicit, always-valid direction keyword.
  const direction = alternate ? 'alternate' : 'normal';

  let styleEl = document.getElementById('dynamic-animation-styles');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'dynamic-animation-styles';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = keyframes;

  const el = document.getElementById('animElement');

  // Build the shorthand from parts so spacing can't go wrong
  const animationValue = [
    'animate',
    `${duration}s`,
    timing,
    direction,
    iterations
  ].join(' ');

  // Restart the animation
  el.style.animation = 'none';
  void el.offsetHeight; // force reflow
  el.style.animation = animationValue;

  // Diagnostic
  if (!el.style.animation) {
    console.warn('Animation value rejected by browser:', animationValue);
  }
}

function randomAnimation() {
  const types = ['bounce', 'pulse', 'shake', 'float'];
  document.getElementById('animType').value = types[Math.floor(Math.random() * types.length)];
  document.getElementById('animDuration').value = (0.5 + Math.random() * 2).toFixed(1);
  document.getElementById('animIterations').value = Math.random() > 0.5 ? 'infinite' : '3';
  updateAnimation();
}

// ===== PRESETS =====
const presets = [
  { name: 'Sunset', colors: ['#f97316', '#ef4444', '#ec4899'] },
  { name: 'Ocean', colors: ['#06b6d4', '#3b82f6', '#6366f1'] },
  { name: 'Forest', colors: ['#22c55e', '#10b981', '#059669'] },
  { name: 'Purple Dream', colors: ['#8b5cf6', '#a855f7', '#d946ef'] },
  { name: 'Midnight', colors: ['#1e1b4b', '#312e81', '#4338ca'] },
  { name: 'Rose', colors: ['#fb7185', '#f43f5e', '#e11d48'] },
  { name: 'Aurora', colors: ['#34d399', '#3b82f6', '#a78bfa'] },
  { name: 'Fire', colors: ['#fbbf24', '#f97316', '#dc2626'] },
  { name: 'Candy', colors: ['#f472b6', '#c084fc', '#818cf8'] },
  { name: 'Neon', colors: ['#22d3ee', '#a3e635', '#f472b6'] },
  { name: 'Cherry', colors: ['#fb923c', '#f43f5e', '#be123c'] },
  { name: 'Arctic', colors: ['#e0f2fe', '#7dd3fc', '#0ea5e9'] },
];

function initPresets() {
  const grid = document.getElementById('presetGrid');
  presets.forEach(preset => {
    const bg = `linear-gradient(135deg, ${preset.colors.join(', ')})`;
    const div = document.createElement('div');
    div.className = 'preset';
    div.style.background = bg;
    div.title = preset.name;
    div.onclick = () => loadPreset(preset);
    grid.appendChild(div);

    const label = document.createElement('div');
    label.className = 'preset-label';
    label.textContent = preset.name;
    grid.appendChild(label);
  });
}

function loadPreset(preset) {
  document.getElementById('gradientType').value = 'linear';
  document.getElementById('angle').value = 135;
  colorStops = preset.colors.map((c, i) => ({
    color: c,
    position: Math.round((i / (preset.colors.length - 1)) * 100)
  }));
  renderColorStops();
  updateGradient();
  switchTab('gradient');
}

// ===== UTILITIES =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  // Find the tab button that corresponds to this tab
  const tabs = document.querySelectorAll('.tab');
  const tabMap = { gradient: 0, animation: 1, presets: 2 };
  if (tabs[tabMap[tab]]) tabs[tabMap[tab]].classList.add('active');
  document.getElementById(tab + '-panel').classList.add('active');
}

function copyCode(type) {
  const text = type === 'gradient' ? currentGradientCode : currentAnimationCode;
  navigator.clipboard.writeText(text).then(() => {
    const fb = document.getElementById('copyFeedback');
    fb.classList.add('show');
    setTimeout(() => fb.classList.remove('show'), 2000);
  });
}

// ===== INIT =====
init();
</script>
