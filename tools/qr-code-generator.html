            // Dark module
            matrix[4 * ver + 9][8] = 1;
            reserved[4 * ver + 9][8] = true;
            
            // Format info areas (reserved for later)
            for (let i = 0; i < 8; i++) {
                reserved[8][i] = true;
                reserved[8][size - 1 - i] = true;
                reserved[i][8] = true;
                reserved[size - 1 - i][8] = true;
            }
            reserved[8][8] = true;
            
            // Version info areas (ver >= 7)
            if (ver >= 7) {
                for (let i = 0; i < 6; i++) {
                    for (let j = 0; j < 3; j++) {
                        reserved[i][size - 11 + j] = true;
                        reserved[size - 11 + j][i] = true;
                    }
                }
            }
        }

        function getDataBits({ver, dataBytes}) {
            let ecl = "M";
            let numBlocks = NUM_EC_BLOCKS[ecl][ver - 1];
            let blockLen = ECC_CODEWORDS_PER_BLOCK[ecl][ver - 1];
            let totalData = dataBytes.length;
            
            // Split into blocks and add EC
            let allCodewords = [];
            let offset = 0;
            for (let i = 0; i < numBlocks; i++) {
                let len = Math.floor((totalData - numEcForAllBlocks(ver, ecl)) / numBlocks);
                let extra = (i < (totalData % numBlocks)) ? 1 : 0;
                let block = dataBytes.slice(offset, offset + len + extra);
                let ec = rsEncode(block, blockLen);
                allCodewords.push(...block, ...ec);
                offset += len + extra;
            }
            
            // Convert to bit stream
            let bits = [];
            for (let b of allCodewords) {
                for (let i = 7; i >= 0; i--) {
                    bits.push((b >> i) & 1);
                }
            }
            return bits;
        }

        function numEcForAllBlocks(ver, ecl) {
            let numBlocks = NUM_EC_BLOCKS[ecl][ver - 1];
            let blockLen = ECC_CODEWORDS_PER_BLOCK[ecl][ver - 1];
            return numBlocks * blockLen;
        }

        function placeDataBits({matrix, reserved, size}, bits, ver) {
            let bitIdx = 0;
            let upward = true;
            for (let right = size - 1; right >= 1; right -= 2) {
                if (right === 6) right = 5;
                for (let vert = 0; vert < size; vert++) {
                    for (let j = 0; j < 2; j++) {
                        let x = right - j;
                        let y = upward ? size - 1 - vert : vert;
                        if (reserved[y][x]) continue;
                        matrix[y][x] = bitIdx < bits.length ? bits[bitIdx] : 0;
                        bitIdx++;
                    }
                }
                upward = !upward;
            }
        }

        function maskMatrix({matrix, reserved, size}, maskNum) {
            let maskFn = [
                (x, y) => (x + y) % 2 === 0,
                (x, y) => y % 2 === 0,
                (x, y) => x % 3 === 0,
                (x, y) => (x + y) % 3 === 0,
                (x, y) => (Math.floor(y/2) + Math.floor(x/3)) % 2 === 0,
                (x, y) => (x*y)%2 + (x*y)%3 === 0,
                (x, y) => ((x*y)%2 + (x*y)%3) % 2 === 0,
                (x, y) => ((x+y)%2 + (x*y)%3) % 2 === 0
            ][maskNum];
            
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (!reserved[y][x] && maskFn(x, y)) {
                        matrix[y][x] ^= 1;
                    }
                }
            }
        }

        function getFormatBits(ecl, maskNum) {
            let eclBits = {L: 1, M: 0, Q: 3, H: 2}[ecl];
            let formatData = (eclBits << 3) | maskNum;
            let bch = formatData << 10;
            for (let i = 4; i >= 0; i--) {
                if (bch & (1 << (i + 10))) {
                    bch ^= 0x537 << i;
                }
            }
            let format = ((formatData << 10) | bch) ^ 0x5412;
            let bits = [];
            for (let i = 14; i >= 0; i--) {
                bits.push((format >> i) & 1);
            }
            return bits;
        }

        function placeFormatBits({matrix, reserved, size}, bits) {
            let positions1 = [
                [8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],
                [7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]
            ];
            let positions2 = [
                [size-1,8],[size-2,8],[size-3,8],[size-4,8],[size-5,8],[size-6,8],[size-7,8],
                [8,size-8],[8,size-7],[8,size-6],[8,size-5],[8,size-4],[8,size-3],[8,size-2],[8,size-1]
            ];
            for (let i = 0; i < 15; i++) {
                let [x1, y1] = positions1[i];
                let [x2, y2] = positions2[i];
                matrix[y1][x1] = bits[i];
                matrix[y2][x2] = bits[i];
            }
        }

        function generateQR(data, ecl = "M") {
            let encoded = encodeData(data, ecl);
            if (!encoded) return null;
            
            let { ver, dataBytes } = encoded;
            let { matrix, reserved, size } = createMatrix(ver);
            
            setFunctionPatterns({matrix, reserved, size}, ver);
            let bits = getDataBits(encoded);
            placeDataBits({matrix, reserved, size}, bits, ver);
            
            // Try all masks, pick best
            let bestScore = Infinity;
            let bestMatrix = null;
            
            for (let mask = 0; mask < 8; mask++) {
                let testMatrix = matrix.map(r => [...r]);
                maskMatrix({matrix: testMatrix, reserved, size}, mask);
                placeFormatBits({matrix: testMatrix, reserved: reserved, size}, getFormatBits(ecl, mask));
                
                let score = evaluatePattern(testMatrix, size);
                if (score < bestScore) {
                    bestScore = score;
                    bestMatrix = testMatrix;
                }
            }
            
            return { matrix: bestMatrix, size, version: ver };
        }

        function evaluatePattern(matrix, size) {
            let score = 0;
            // Adjacent same-color modules (5 in a row)
            for (let y = 0; y < size; y++) {
                let count = 1;
                for (let x = 1; x < size; x++) {
                    if (matrix[y][x] === matrix[y][x-1]) {
                        count++;
                        if (count === 5) score += 3;
                        else if (count > 5) score += 1;
                    } else count = 1;
                }
            }
            for (let x = 0; x < size; x++) {
                let count = 1;
                for (let y = 1; y < size; y++) {
                    if (matrix[y][x] === matrix[y-1][x]) {
                        count++;
                        if (count === 5) score += 3;
                        else if (count > 5) score += 1;
                    } else count = 1;
                }
            }
            // Finder-like patterns
            for (let y = 0; y < size - 6; y++) {
                for (let x = 0; x < size - 6; x++) {
                    let pattern = 0;
                    for (let dy = 0; dy < 7; dy++) {
                        pattern = (pattern << 1) | matrix[y+dy][x];
                    }
                    if (pattern === 0x07 || pattern === 0x45) score += 40;
                }
            }
            // Proportion of dark modules
            let dark = 0;
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (matrix[y][x] === 1) dark++;
                }
            }
            let pct = dark / (size * size) * 100;
            score += Math.abs(pct - 50) / 5 * 10;
            return score;
        }

        return { generateQR };
    })();

    // UI Logic
    let currentType = "url";
    
    document.querySelectorAll(".type-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentType = btn.dataset.type;
            document.querySelectorAll(".form-type").forEach(f => f.classList.add("hidden"));
            document.getElementById("form-" + currentType).classList.remove("hidden");
            document.getElementById("qr-output").style.display = "none";
        });
    });

    function generateQR() {
        let errorMsg = document.getElementById("error-msg");
        errorMsg.style.display = "none";
        
        let data = "";
        switch(currentType) {
            case "url":
                data = document.getElementById("qr-url").value.trim();
                if (!data) { showError("Please enter a URL"); return; }
                if (!data.startsWith("http://") && !data.startsWith("https://")) {
                    data = "https://" + data;
                }
                break;
            case "text":
                data = document.getElementById("qr-text").value.trim();
                if (!data) { showError("Please enter some text"); return; }
                break;
            case "wifi":
                let ssid = document.getElementById("wifi-ssid").value.trim();
                let pass = document.getElementById("wifi-pass").value;
                let sec = document.getElementById("wifi-security").value;
                if (!ssid) { showError("Please enter network name"); return; }
                data = "WIFI:T:" + sec + ";S:" + ssid + ";P:" + pass + ";;";
                break;
            case "email":
                let addr = document.getElementById("email-addr").value.trim();
                let subj = document.getElementById("email-subject").value.trim();
                let body = document.getElementById("email-body").value.trim();
                if (!addr) { showError("Please enter email address"); return; }
                data = "mailto:" + addr + "?subject=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(body);
                break;
        }

        let size = parseInt(document.getElementById("qr-size").value);
        let fgColor = document.getElementById("qr-fg").value;
        let bgColor = document.getElementById("qr-bg").value;

        let qr = QRCodeLib.generateQR(data);
        if (!qr) { showError("Data too long for QR code. Try shorter text."); return; }

        let canvas = document.getElementById("qr-canvas");
        let moduleCount = qr.size;
        let moduleSize = size / moduleCount;
        
        canvas.width = size;
        canvas.height = size;
        let ctx = canvas.getContext("2d");
        
        // Background
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, size, size);
        
        // Modules
        ctx.fillStyle = fgColor;
        for (let y = 0; y < moduleCount; y++) {
            for (let x = 0; x < moduleCount; x++) {
                if (qr.matrix[y][x] === 1) {
                    ctx.fillRect(
                        Math.round(x * moduleSize),
                        Math.round(y * moduleSize),
                        Math.ceil(moduleSize),
                        Math.ceil(moduleSize)
                    );
                }
            }
        }

        // Preview
        document.getElementById("qr-data-preview").textContent = 
            currentType === "url" ? "URL: " + data.substring(0, 50) + (data.length > 50 ? "..." : "") :
            currentType === "wifi" ? "WiFi: " + document.getElementById("wifi-ssid").value :
            currentType === "email" ? "Email: " + document.getElementById("email-addr").value :
            "Text: " + data.substring(0, 50) + (data.length > 50 ? "..." : "");

        // Download buttons
        document.getElementById("dl-png").href = canvas.toDataURL("image/png");
        
        // SVG download
        let svgParts = [`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`];
        svgParts.push(`<rect width="${size}" height="${size}" fill="${bgColor}"/>`);
        for (let y = 0; y < moduleCount; y++) {
            for (let x = 0; x < moduleCount; x++) {
                if (qr.matrix[y][x] === 1) {
                    svgParts.push(`<rect x="${Math.round(x * moduleSize)}" y="${Math.round(y * moduleSize)}" width="${Math.ceil(moduleSize)}" height="${Math.ceil(moduleSize)}" fill="${fgColor}"/>`);
                }
            }
        }
        svgParts.push("</svg>");
        let svgBlob = new Blob([svgParts.join("")], {type: "image/svg+xml"});
        document.getElementById("dl-svg").href = URL.createObjectURL(svgBlob);

        document.getElementById("qr-output").style.display = "block";
    }

    function showError(msg) {
        let errorMsg = document.getElementById("error-msg");
        errorMsg.textContent = msg;
        errorMsg.style.display = "block";
    }
    </script>
</body>
