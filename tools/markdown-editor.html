<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Editor — Free, Offline, No Signup</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="description" content="A free, offline markdown editor that works in your browser. No signup, no tracking, no server. Open, write, preview.">
<meta name="keywords" content="markdown editor, online markdown, free markdown, offline editor, commonmark">
<link rel="canonical" href="https://k1r4.space/markdown-editor.html">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #58a6ff;
  }

  header .actions {
    display: flex;
    gap: 8px;
  }

  header button {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }

  header button:hover {
    background: #30363d;
  }

  header button.primary {
    background: #238636;
    border-color: #238636;
    color: #fff;
  }

  header button.primary:hover {
    background: #2ea043;
  }

  .status {
    font-size: 12px;
    color: #8b949e;
    padding: 0 8px;
  }

  .status.saved { color: #3fb950; }
  .status.unsaved { color: #d29922; }

  .container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .pane-header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8b949e;
    flex-shrink: 0;
  }

  #editor {
    flex: 1;
    width: 100%;
    background: #0d1117;
    color: #e6edf3;
    border: none;
    padding: 20px;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 14px;
    line-height: 1.7;
    resize: none;
    outline: none;
    tab-size: 2;
  }

  #editor::placeholder {
    color: #484f58;
  }

  #editor.drag-over {
    background: #1a2332;
    border: 2px dashed #58a6ff;
    border-radius: 4px;
  }

  #preview {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    background: #0d1117;
    border-left: 1px solid #30363d;
  }

  /* Markdown preview styles */
  #preview h1 { font-size: 2em; margin: 0.5em 0 0.3em; color: #58a6ff; border-bottom: 1px solid #21262d; padding-bottom: 0.3em; }
  #preview h2 { font-size: 1.5em; margin: 0.5em 0 0.3em; color: #58a6ff; border-bottom: 1px solid #21262d; padding-bottom: 0.2em; }
  #preview h3 { font-size: 1.25em; margin: 0.5em 0 0.3em; color: #d2a8ff; }
  #preview h4 { font-size: 1.1em; margin: 0.5em 0 0.3em; color: #d2a8ff; }
  #preview h5, #preview h6 { font-size: 1em; margin: 0.5em 0 0.3em; color: #8b949e; }
  #preview p { margin: 0.6em 0; line-height: 1.7; }
  #preview strong { color: #f0f6fc; }
  #preview em { color: #c9d1d9; }
  #preview a { color: #58a6ff; text-decoration: none; }
  #preview a:hover { text-decoration: underline; }
  #preview img { max-width: 100%; border-radius: 6px; margin: 0.5em 0; }
  #preview code {
    background: #161b22;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.9em;
    color: #ff7b72;
  }
  #preview pre {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    margin: 1em 0;
  }
  #preview pre code {
    background: none;
    padding: 0;
    color: #c9d1d9;
  }
  #preview ul, #preview ol {
    margin: 0.5em 0;
    padding-left: 2em;
  }
  #preview li { margin: 0.3em 0; line-height: 1.6; }
  #preview blockquote {
    border-left: 3px solid #388bfd;
    padding: 0.5em 0 0.5em 1em;
    margin: 1em 0;
    color: #8b949e;
  }
  #preview hr {
    border: none;
    border-top: 1px solid #21262d;
    margin: 1.5em 0;
  }
  #preview table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0;
  }
  #preview th, #preview td {
    border: 1px solid #30363d;
    padding: 8px 12px;
    text-align: left;
  }
  #preview th {
    background: #161b22;
    font-weight: 600;
  }

  .divider {
    width: 4px;
    background: #30363d;
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .divider:hover { background: #58a6ff; }

  /* Mobile responsive */
  @media (max-width: 768px) {
    .container { flex-direction: column; }
    #preview { border-left: none; border-top: 1px solid #30363d; }
    .divider { width: 100%; height: 4px; cursor: row-resize; }
  }

  /* Word count bar */
  .info-bar {
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 6px 16px;
    font-size: 11px;
    color: #484f58;
    display: flex;
    gap: 16px;
    flex-shrink: 0;
  }

  .info-bar span { color: #8b949e; }
</style>
</head>
<body>

<header>
  <h1>MD Editor — k1r4.space</h1>
  <div class="actions">
    <span class="status" id="status">Ready</span>
    <button onclick="clearEditor()">Clear</button>
    <button onclick="downloadMD()">Download .md</button>
    <button class="primary" onclick="copyHTML()">Copy HTML</button>
  </div>
</header>

<div class="container">
  <div class="pane">
    <div class="pane-header">Markdown</div>
    <textarea id="editor" placeholder="Type your markdown here...&#10;&#10;# Heading 1&#10;## Heading 2&#10;&#10;**bold** and *italic*&#10;&#10;- List item 1&#10;- List item 2&#10;&#10;`inline code`&#10;&#10;```&#10;code block&#10;```&#10;&#10;[link](https://example.com)&#10;&#10;> blockquote"></textarea>
  </div>
  <div class="divider" id="divider"></div>
  <div class="pane">
    <div class="pane-header">Preview</div>
    <div id="preview"></div>
  </div>
</div>

<div class="info-bar">
  <div>Chars: <span id="char-count">0</span></div>
  <div>Words: <span id="word-count">0</span></div>
  <div>Lines: <span id="line-count">0</span></div>
</div>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
let saveTimer = null;

// Lightweight CommonMark parser
function parseMarkdown(text) {
  if (!text.trim()) return '<p style="color:#484f58;">Preview will appear here as you type...</p>';

  let html = text;

  // Normalize line endings
  html = html.replace(/\r\n/g, '\n');

  // Escape HTML (but preserve our markdown)
  html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Code blocks (fenced). Their contents are literal, so they are lifted out into
  // placeholders and put back just before the paragraph pass: otherwise every rule below
  // runs straight through the code and rewrites it (found 2026-10-11 by running it:
  // "```\n**x**\n```" came back as <strong>x</strong> inside the <pre>).
  const blocks = [];
  const stash = (kind, built) => { blocks.push([kind, built]); return '\u0000' + kind + (blocks.length - 1) + '\u0000'; };
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
    return stash('CODE', '<pre><code class="language-' + lang + '">' + code.trim() + '</code></pre>');
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Headings
  html = html.replace(/^###### (.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^##### (.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Horizontal rules
  html = html.replace(/^(?:---+|___+|\*\*\*+)\s*$/gm, '<hr>');

  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Merge consecutive blockquotes
  html = html.replace(/<\/blockquote>\n<blockquote>/g, '\n');

  // Bold + italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/_(.+?)_/g, '<em>$1</em>');
  // Strikethrough
  html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');

  // Images
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Lists. Ordered first, each wrapped in its own tag. The <ul> rule below matches any run
  // of <li>, so an ordered list converted before it would be swallowed into a <ul>; and
  // converted after it, as this used to be, a numbered list came out as bare <li> with no
  // list around it at all (found 2026-10-11).
  // The ordered list is stashed too: the <ul> wrapping below matches any run of <li>, so an
  // <ol> left in the text would come back as <ol><ul><li>…</li></ul></ol>.
  html = html.replace(/(?:^[\s]*\d+\. .*(?:\n|$))+/gm, function(block) {
    return stash('LIST', '<ol>\n' + block.replace(/^[\s]*\d+\. (.*)$/gm, '<li>$1</li>').replace(/\n+$/, '') + '\n</ol>\n');
  });

  // Unordered lists
  html = html.replace(/^[\s]*[-*+] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

  // Put the stashed blocks back now the inline rules have run, so the paragraph pass sees
  // them as blocks.
  html = html.replace(/\u0000(CODE|LIST)(\d+)\u0000/g, function(m, kind, i) {
    const b = blocks[+i];
    return b && b[0] === kind ? b[1] : m;
  });

  // Paragraphs — replace double newlines
  html = html.replace(/\n{2,}/g, '</p>\n\n<p>');
  // Wrap remaining content in paragraph tags
  html = '<p>' + html + '</p>';
  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');
  html = html.replace(/<p>\s*(<h[1-6]|<ul|<ol|<pre|<blockquote|<hr)/g, '$1');
  html = html.replace(/(<\/h[1-6]>|<\/ul>|<\/ol>|<\/pre>|<\/blockquote>)\s*<\/p>/g, '$1');

  return html;
}

function updatePreview() {
  preview.innerHTML = parseMarkdown(editor.value);
  updateCounts();
  scheduleSave();
}

function updateCounts() {
  const text = editor.value;
  document.getElementById('char-count').textContent = text.length;
  document.getElementById('word-count').textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('line-count').textContent = text.split('\n').length;
}

function scheduleSave() {
  status.textContent = 'Unsaved';
  status.className = 'status unsaved';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 500);
}

function saveState() {
  try {
    localStorage.setItem('md-editor-content', editor.value);
    status.textContent = 'Saved';
    status.className = 'status saved';
  } catch(e) {
    status.textContent = 'Save failed (storage full)';
    status.className = 'status unsaved';
  }
}

function loadState() {
  try {
    const saved = localStorage.getItem('md-editor-content');
    if (saved) {
      editor.value = saved;
      status.textContent = 'Restored';
      status.className = 'status saved';
      updatePreview();
    }
  } catch(e) {}
}

function clearEditor() {
  if (confirm('Clear all content? This cannot be undone.')) {
    editor.value = '';
    updatePreview();
    localStorage.removeItem('md-editor-content');
    status.textContent = 'Cleared';
    status.className = 'status unsaved';
  }
}

function downloadMD() {
  const blob = new Blob([editor.value], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'document.md';
  a.click();
  URL.revokeObjectURL(url);
}

function copyHTML() {
  const html = parseMarkdown(editor.value);
  navigator.clipboard.writeText(html).then(() => {
    status.textContent = 'HTML copied!';
    status.className = 'status saved';
    setTimeout(() => { updatePreview(); }, 1500);
  }).catch(() => {
    status.textContent = 'Copy failed';
    status.className = 'status unsaved';
  });
}

// Drag and drop
editor.addEventListener('dragover', (e) => {
  e.preventDefault();
  editor.classList.add('drag-over');
});

editor.addEventListener('dragleave', () => {
  editor.classList.remove('drag-over');
});

editor.addEventListener('drop', (e) => {
  e.preventDefault();
  editor.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      editor.value = ev.target.result;
      updatePreview();
    };
    reader.readAsText(file);
  }
});

// Tab key support
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    updatePreview();
  }
});

// Divider resize
const divider = document.getElementById('divider');
let isResizing = false;

divider.addEventListener('mousedown', (e) => {
  isResizing = true;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const container = document.querySelector('.container');
  const rect = container.getBoundingClientRect();
  const percent = ((e.clientX - rect.left) / rect.width) * 100;
  const clamped = Math.max(20, Math.min(80, percent));
  document.querySelectorAll('.pane')[0].style.flex = clamped + ' 1';
  document.querySelectorAll('.pane')[1].style.flex = (100 - clamped) + ' 1';
});

document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});

// Init
editor.addEventListener('input', updatePreview);
loadState();
updatePreview();
</script>
</body>
</html>
