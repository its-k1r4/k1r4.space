<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Password Generator — Free, Offline, No Tracking</title>
<meta name="description" content="Generate cryptographically secure passwords offline. Customize length, character types, and strength. No data leaves your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<style>
  :root {
    --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
    --text: #f1f5f9; --text2: #94a3b8; --text3: #64748b;
    --accent: #8b5cf6; --accent2: #a78bfa;
    --green: #22c55e; --red: #ef4444; --yellow: #eab308;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .container {
    width: 100%; max-width: 560px;
    background: var(--bg2); border-radius: 20px;
    padding: 32px; box-shadow: 0 25px 60px rgba(0,0,0,0.3);
  }
  h1 {
    text-align: center; font-size: 1.6rem; margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { text-align: center; color: var(--text3); font-size: 0.85rem; margin-bottom: 28px; }
  .password-display {
    background: var(--bg); border-radius: var(--radius); padding: 16px 20px;
    display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
    border: 2px solid var(--bg3); transition: border-color 0.2s;
  }
  .password-display:hover { border-color: var(--accent); }
  #password {
    flex: 1; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 1.15rem; color: var(--text); word-break: break-all;
    min-height: 1.5em; user-select: all;
  }
  .btn-icon {
    width: 40px; height: 40px; border-radius: 10px; border: none;
    background: var(--bg3); color: var(--text2); cursor: pointer;
    font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  .btn-icon:hover { background: var(--accent); color: white; }
  .strength-bar {
    height: 4px; border-radius: 2px; background: var(--bg3);
    margin-bottom: 24px; overflow: hidden;
  }
  .strength-fill {
    height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s;
  }
  .strength-label {
    text-align: center; font-size: 0.75rem; color: var(--text3);
    margin-bottom: 20px; min-height: 1.2em;
  }
  .controls { display: flex; flex-direction: column; gap: 16px; }
  .control-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .control-label { font-size: 0.9rem; color: var(--text2); white-space: nowrap; }
  .length-slider {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 6px; border-radius: 3px; background: var(--bg3); outline: none;
  }
  .length-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  .length-value {
    min-width: 40px; text-align: center; font-weight: 700;
    font-size: 1.1rem; color: var(--accent);
  }
  .checkbox-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .checkbox-btn {
    padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--bg3);
    background: transparent; color: var(--text2); cursor: pointer;
    font-size: 0.82rem; font-weight: 500; transition: all 0.15s;
  }
  .checkbox-btn:hover { border-color: var(--accent); }
  .checkbox-btn.active {
    background: var(--accent); border-color: var(--accent);
    color: white;
  }
  .generate-btn {
    width: 100%; padding: 14px; border-radius: var(--radius); border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; font-size: 1rem; font-weight: 600; cursor: pointer;
    margin-top: 8px; transition: all 0.2s;
  }
  .generate-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(139,92,246,0.3); }
  .generate-btn:active { transform: translateY(0); }
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--green); color: white; padding: 10px 24px;
    border-radius: 10px; font-size: 0.9rem; font-weight: 500;
    opacity: 0; transition: all 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .info {
    margin-top: 20px; padding: 12px 16px; background: var(--bg);
    border-radius: 10px; font-size: 0.78rem; color: var(--text3); line-height: 1.5;
  }
  @media (max-width: 480px) {
    .container { padding: 24px 20px; }
    h1 { font-size: 1.3rem; }
    #password { font-size: 1rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔐 Password Generator</h1>
  <p class="subtitle">Cryptographically secure · Works offline · No tracking</p>
  
  <div class="password-display">
    <div id="password"></div>
    <button class="btn-icon" onclick="copyPassword()" title="Copy">📋</button>
    <button class="btn-icon" onclick="generatePassword()" title="Generate">🔄</button>
  </div>
  
  <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
  <div class="strength-label" id="strengthLabel"></div>
  
  <div class="controls">
    <div class="control-row">
      <span class="control-label">Length</span>
      <input type="range" class="length-slider" id="lengthSlider" min="4" max="64" value="16">
      <span class="length-value" id="lengthValue">16</span>
    </div>
    
    <div class="control-row">
      <span class="control-label">Characters</span>
      <div class="checkbox-group">
        <button class="checkbox-btn active" data-set="uppercase" onclick="toggleSet(this)">ABC</button>
        <button class="checkbox-btn active" data-set="lowercase" onclick="toggleSet(this)">abc</button>
        <button class="checkbox-btn active" data-set="numbers" onclick="toggleSet(this)">123</button>
        <button class="checkbox-btn active" data-set="symbols" onclick="toggleSet(this)!@#</button>
      </div>
    </div>
    
    <button class="generate-btn" onclick="generatePassword()">Generate Password</button>
  </div>
  
  <div class="info">
    <strong>How it works:</strong> Uses <code>crypto.getRandomValues()</code> for cryptographically secure randomness. 
    All generation happens locally in your browser — no data is ever sent anywhere.
  </div>
</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
const SETS = {
  uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lowercase: 'abcdefghijklmnopqrstuvwxyz',
  numbers: '0123456789',
  symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?/~`'
};

let activeSets = new Set(['uppercase', 'lowercase', 'numbers', 'symbols']);
let currentPassword = '';

function secureRandom(max) {
  const array = new Uint32Array(1);
  crypto.getRandomValues(array);
  return array[0] % max;
}

function generatePassword() {
  if (activeSets.size === 0) {
    showToast('Select at least one character type');
    return;
  }
  
  const length = parseInt(document.getElementById('lengthSlider').value);
  let charset = '';
  for (const set of activeSets) charset += SETS[set];
  
  // Ensure at least one character from each active set. This must draw from the set itself:
  // drawing from the whole charset, as this used to, made the promise false, and at the
  // shortest length (4, with all four sets on) the password was exactly those four draws —
  // so a password could come back with no symbol and no capital while both were ticked
  // (found 2026-10-11 by generating one).
  let password = [];
  for (const set of activeSets) {
    password.push(SETS[set][secureRandom(SETS[set].length)]);
  }
  
  // Fill remaining length
  for (let i = password.length; i < length; i++) {
    password.push(charset[secureRandom(charset.length)]);
  }
  
  // Shuffle using Fisher-Yates
  for (let i = password.length - 1; i > 0; i--) {
    const j = secureRandom(i + 1);
    [password[i], password[j]] = [password[j], password[i]];
  }
  
  currentPassword = password.join('');
  document.getElementById('password').textContent = currentPassword;
  updateStrength();
}

function updateStrength() {
  if (!currentPassword) return;
  
  const length = currentPassword.length;
  const entropy = Math.log2(Math.pow(SET_COUNT(), length));
  
  let strength, color;
  if (entropy < 30) { strength = 'Very Weak'; color = 'var(--red)'; }
  else if (entropy < 50) { strength = 'Weak'; color = '#f97316'; }
  else if (entropy < 70) { strength = 'Moderate'; color = 'var(--yellow)'; }
  else if (entropy < 90) { strength = 'Strong'; color = '#4ade80'; }
  else { strength = 'Very Strong'; color = 'var(--green)'; }
  
  const fill = document.getElementById('strengthFill');
  fill.style.width = Math.min(100, entropy) + '%';
  fill.style.background = color;
  document.getElementById('strengthLabel').textContent = `Entropy: ${entropy.toFixed(1)} bits — ${strength}`;
}

function SET_COUNT() {
  let count = 0;
  for (const set of activeSets) count += SETS[set].length;
  return count || 1;
}

function toggleSet(btn) {
  const set = btn.dataset.set;
  btn.classList.toggle('active');
  if (activeSets.has(set)) activeSets.delete(set);
  else activeSets.add(set);
  generatePassword();
}

function copyPassword() {
  if (!currentPassword) return;
  navigator.clipboard.writeText(currentPassword).then(() => showToast('Copied to clipboard!'));
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Slider display
document.getElementById('lengthSlider').addEventListener('input', function() {
  document.getElementById('lengthValue').textContent = this.value;
  generatePassword();
});

// Generate on load
generatePassword();
</script>
</body>
</html>
